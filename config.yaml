submission:
  cutoff_datetime: "2026-03-27 23:59:59"
  timezone: "Europe/Madrid"

scoring:
  modularization:
    main_entry_signal: 2.0
    core_module_thresholds:
      - min: 5
        points: 3.0
      - min: 3
        points: 2.0
      - min: 1
        points: 1.0
    orchestrated_module_thresholds:
      - min: 7
        points: 5.0
      - min: 6
        points: 3.0
      - min: 4
        points: 2.0
      - min: 2
        points: 1.0
    stub_penalty_threshold: 0.5
    stub_penalty: 1.0

  code_quality:
    base_score: 10.0
    ruff_per_issue: 0.05
    ruff_cap: 2.0
    pylint_target: 8.5
    pylint_gap_weight: 0.3
    radon_baseline: 5.0
    radon_gap_weight: 0.2

  documentation:
    qualitative_only: true
    readme_present: 0.0

  testing:
    pytest_pass_rate_weight: 4.0
    coverage_cap: 6.0
    coverage_divisor: 14.5
    environment_cap: 6.0

  dependencies:
    env_or_conda_present: 10.0

  config_reproducibility:
    config_yaml_present: 1.5
    config_yaml_has_keys: 0.5
    environment_yml_present: 1.0
    conda_lock_yml_present: 2.0
    main_reads_config_signal: 2.0
    env_contract_signal: 0.5
    gitignore_excludes_env: 0.5
    dotenv_usage_signal: 0.5
    runtime_config_keys_min: 3
    runtime_config_keys_points: 1.5
    hardcoded_path_penalty: 0.5
    hardcoded_path_penalty_cap: 1.5
    hardcoded_hyperparam_penalty: 0.5
    hardcoded_hyperparam_penalty_cap: 1.5
    missing_config_yaml_cap: 4.0
    missing_conda_lock_cap: 8.0
    secret_literal_cap: 6.0

  security_secrets:
    sec_gitignore_excludes_env: 3.5
    sec_dockerignore_excludes_env: 2.5
    sec_no_secret_literals: 4.0
    sec_tracked_env_cap: 2.0
    sec_secret_literal_cap: 4.0
    sec_tracked_env_like_files_cap: 5.0

  logging_observability:
    log_print_free: 3.0
    log_logger_module_present: 1.5
    log_file_handler_present: 1.5
    log_stream_handler_present: 1.0
    log_dual_output_signal: 1.0
    log_logfile_path_present: 0.5
    log_logger_usage_signal: 1.5
    print_calls_allowed: 3
    print_calls_cap: 6.0
    too_many_print_calls_cap: 5.0
    missing_logger_module_cap: 4.0
    missing_dual_output_cap: 6.0
    missing_usage_cap: 8.0
    fallback_logger_module_penalty: 1.0

  experiment_tracking:
    wandb_import_present: 0.5
    wandb_init_in_main: 2.0
    wandb_config_logged: 1.5
    wandb_run_metadata_logged: 1.5
    wandb_eval_metrics_logged: 2.5
    wandb_rich_eval_tracking_logged: 0.5
    wandb_model_artifact_logged: 1.5
    missing_wandb_init_in_main_cap: 4.0
    missing_eval_metrics_cap: 5.0
    missing_model_artifact_cap: 8.0

  error_handling:
    validation_function_present: 1.0
    validation_raise_present: 1.0
    validation_none_or_type_guard: 1.0
    validation_empty_guard: 1.0
    validation_required_columns_guard: 2.0
    validation_missing_values_guard: 1.0
    validation_target_guard: 1.5
    validation_dtype_guard: 1.5
    validation_range_or_domain_guard: 1.0
    no_advanced_validation_cap: 6.0
    missing_foundation_cap: 6.0

  artifacting:
    processed_data_artifact_present: 2.5
    model_artifact_present: 4.0
    prediction_artifact_present: 2.5
    structured_asset_paths_present: 1.0
    missing_model_artifact_cap: 5.0
    missing_prediction_artifact_cap: 7.5

  pipeline:
    valid_target_notebook_present: 10.0

  version_control:
    strong_min_pr_authors: 5
    strong_min_prs: 5
    strong_min_reviewers: 3

    good_min_pr_authors: 4
    good_min_prs: 4

    basic_min_pr_authors: 3
    basic_min_prs: 3

    limited_min_pr_authors: 2
    limited_min_prs: 2

    minimal_min_pr_authors: 1
    minimal_min_prs: 1
